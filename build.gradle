plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

def localMinecraftMetadataServer = {
	def metadataDir = file("gradle/minecraft")
	def server = com.sun.net.httpserver.HttpServer.create(new java.net.InetSocketAddress("127.0.0.1", 0), 0)
	server.createContext("/26.2-custom.json") { exchange ->
		byte[] body = new File(metadataDir, "26.2-custom.json").bytes
		exchange.responseHeaders.add("Content-Type", "application/json")
		exchange.sendResponseHeaders(200, body.length)
		exchange.responseBody.write(body)
		exchange.close()
	}
	server.start()
	gradle.buildFinished { server.stop(0) }
	return "http://127.0.0.1:${server.address.port}/26.2-custom.json"
}.call()

loom {
	noIntermediateMappings()
	customMinecraftMetadata.set(localMinecraftMetadataServer)
	mods {
		"omwh" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java']
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
}

tasks.named('test') {
	failOnNoDiscoveredTests = false
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings files("gradle/minecraft/identity-official-26.2.jar")
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2:3.1.0+00cb03469c"
	modImplementation "net.fabricmc.fabric-api:fabric-entity-events-v1:5.0.5+06488ac19c"
	modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.3+4575b05f9c"
	modImplementation "net.fabricmc.fabric-api:fabric-networking-api-v1:6.3.3+72073ef09c"
	modImplementation "net.fabricmc.fabric-api:fabric-api-base:2.0.4+ece063239c"
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// See https://docs.gradle.org/current/userguide/publishing_maven.html for more information
		// about publishing to Maven repositories.
		// mavenLocal()
	}
}

